[package]
name = "realflight-bridge"
version = "2.0.1"
edition = "2024"
rust-version = "1.85"
authors = ["Wil Boayue <wil@wsbsolutions.com>"]
readme = "README.md"
description = "RealFlightBridge is a Rust library that interfaces with RealFlight Link, enabling external flight controllers to interact with the simulator."
homepage = "https://github.com/wboayue/realflight-bridge/"
repository = "https://github.com/wboayue/realflight-bridge/"
documentation = "https://docs.rs/realflight-bridge/latest/realflight_bridge/index.html"
license = "MIT"
keywords = ["realflight", "flightaxis", "flight-simulator", "uav", "robotics"]
categories = ["aerospace::simulation", "aerospace::drones", "aerospace::unmanned-aerial-vehicles", "simulation", "science::robotics"]
include = ["src/", "README.md", "LICENSE", "examples/", "benches/", "testdata/", "!**/.DS_Store"]

[package.metadata.docs.rs]
features = ["rt-tokio", "mint"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
bench-internals = []
rt-tokio = ["dep:tokio", "dep:tokio-util"]
mint = ["dep:mint"]

[dependencies]
env_logger = "0.11.8"
log = "0.4.29"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
thiserror = "2.0"
clap = { version = "4.5.54", features = ["derive"] }
tokio = { version = "1", features = ["net", "io-util", "rt", "sync", "time", "macros", "rt-multi-thread", "signal"], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
mint = { version = "0.5", optional = true }

[dev-dependencies]
clap = "4.5.54"
rand = "0.10"
criterion = { version = "0.8", features = ["html_reports"] }
approx = "0.5.1"
nalgebra = { version = "0.34", features = ["mint"] }

[[bin]]
name = "realflight_bridge_proxy"
required-features = ["rt-tokio"]

[[bench]]
name = "decode_state_bench"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "frame_bench"
harness = false
required-features = ["bench-internals"]
